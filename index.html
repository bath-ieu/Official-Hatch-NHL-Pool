<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Super Pool</title>
<style>
:root {
  --border-color: #34495e;
  --accent-red: #e0564c;
  --text-dark: #2c3e50;
  --bg-details: #f8fafc;
  --green-arrow: #22c55e;
  --red-arrow: #ef4444;
}

body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
  background: linear-gradient(180deg, #ffffff 0%, #d1d5db 50%, #9ca3af 100%);
  background-attachment: fixed;
  color: var(--text-dark); 
  margin: 0; 
  padding: 0;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== PATTERN D'ÉLÉMENTS PNG ===== */
.bg-shapes {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.bg-shape {
  position: absolute;
  opacity: 0.07;          /* même opacité qu'avant */
  background-image: url('./images/shape.png');  /* ← change le nom si besoin */
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* Beaucoup plus d'éléments, positions variées */
.s1  { top: 2%;   left: -6%;  width: 280px; height: 250px; transform: rotate(-15deg); }
.s2  { top: 8%;   right: -7%; width: 340px; height: 300px; transform: rotate(18deg);  opacity: 0.06; }
.s3  { top: 18%;  left: 5%;   width: 260px; height: 230px; transform: rotate(8deg);   opacity: 0.05; }
.s4  { top: 25%;  right: 8%;  width: 310px; height: 280px; transform: rotate(-22deg); opacity: 0.07; }
.s5  { top: 35%;  left: -8%;  width: 380px; height: 340px; transform: rotate(12deg);  opacity: 0.055; }
.s6  { top: 42%;  right: -5%; width: 290px; height: 260px; transform: rotate(-10deg); opacity: 0.065; }
.s7  { top: 52%;  left: 15%;  width: 320px; height: 290px; transform: rotate(25deg);  opacity: 0.05; }
.s8  { top: 58%;  right: 12%; width: 270px; height: 240px; transform: rotate(-18deg); opacity: 0.07; }
.s9  { top: 68%;  left: -4%;  width: 350px; height: 310px; transform: rotate(6deg);   opacity: 0.06; }
.s10 { top: 72%;  right: -8%; width: 300px; height: 270px; transform: rotate(-28deg); opacity: 0.05; }
.s11 { top: 82%;  left: 20%;  width: 330px; height: 295px; transform: rotate(15deg);  opacity: 0.065; }
.s12 { top: 88%;  right: 5%;  width: 280px; height: 250px; transform: rotate(-12deg); opacity: 0.055; }
.s13 { top: 12%;  left: 45%;  width: 240px; height: 215px; transform: rotate(30deg);  opacity: 0.045; }
.s14 { top: 48%;  left: 50%;  width: 260px; height: 230px; transform: rotate(-25deg); opacity: 0.05; }
.s15 { top: 78%;  left: 55%;  width: 290px; height: 260px; transform: rotate(10deg);  opacity: 0.06; }

.container { 
  width: 100%; 
  max-width: 1100px; 
  margin: 0 auto; 
  box-sizing: border-box;
  padding: 0 15px 20px 15px;
  position: relative;
  z-index: 1;
}

/* ===== ZONE STICKY ===== */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, #ffffff 0%, #d1d5db 50%, #9ca3af 100%);
  background-attachment: fixed;
  padding: 8px 15px 8px 15px;
  margin: 0 -15px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.04);
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
  width: 100%;
}

.brand-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 55%;
  max-width: 320px;
  margin: 0 auto;
}

.hatch-logo {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

h1 { 
  text-align: center; 
  color: var(--text-dark); 
  font-size: clamp(0.95rem, 2.6vw, 1.45rem);
  margin: -22px auto 0 auto;
  font-weight: 800;
  width: 100%;
  white-space: nowrap;
  position: relative;
  z-index: 2;
}

.last-update {
  text-align: center;
  font-size: 0.68rem;
  color: #9ca3af;
  margin: 2px 0 6px 0;
  font-weight: 500;
}

.search-bar {
  width: 100%;
  max-width: 380px;
  margin: 0 auto 4px auto;
  position: relative;
}

.search-bar input {
  width: 100%;
  padding: 9px 16px 9px 40px;
  border: 2.5px solid var(--border-color);
  border-radius: 50px;
  font-size: 0.95rem;
  font-family: inherit;
  color: var(--text-dark);
  background: #ffffff;
  box-sizing: border-box;
  outline: none;
}

.search-bar input:focus {
  border-color: var(--accent-red);
  box-shadow: 0 0 0 3px rgba(224, 86, 76, 0.15);
}

.search-bar input::placeholder {
  color: #94a3b8;
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  pointer-events: none;
  opacity: 0.55;
}

.search-hint {
  text-align: center;
  font-size: 0.72rem;
  color: #9ca3af;
  margin: 0 0 2px 0;
  font-weight: 500;
}

.no-results {
  text-align: center;
  color: #64748b;
  font-size: 1.05rem;
  padding: 30px 10px;
}

.participant-card {
  margin-bottom: 14px;
  width: 100%;
}

/* ===== PASTILLE ===== */
.main-pill {
  width: 100%;
  background-color: #ffffff;
  border: 3.5px solid var(--border-color);
  border-radius: 50px;
  padding: 7px clamp(12px, 3vw, 28px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;
  min-height: 68px;
  cursor: pointer;
  gap: clamp(8px, 2vw, 20px);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
}

.rank-section {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  flex-shrink: 0;
  width: clamp(68px, 10vw, 95px);
  position: relative;
}

.rank-number {
  font-size: clamp(1.4rem, 3.5vw, 2.3rem);
  font-weight: 900;
  color: var(--border-color);
  line-height: 1;
  position: relative;
}

.crown {
  position: absolute;
  top: -0.72em;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.42em;
  line-height: 1;
  pointer-events: none;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
}

.trend-arrow {
  font-size: clamp(0.85rem, 1.8vw, 1.25rem);
  font-weight: 900;
  line-height: 1;
  width: 16px;
  text-align: center;
}

.trend-arrow.up { color: var(--green-arrow); }
.trend-arrow.down { color: var(--red-arrow); }
.trend-arrow.same { visibility: hidden; }

/* === LAYOUT NOM + BREAKDOWN === */
.participant-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex-grow: 1;
  min-width: 0;
}

.participant-info.wide {
  flex-direction: row;
  align-items: center;
  gap: clamp(16px, 2.8vw, 32px);
}

.participant-info.wide .participant-name {
  margin-bottom: 0;
  flex-shrink: 0;
}

.participant-info.wide .points-breakdown {
  flex-grow: 1;
  justify-content: flex-start;
}

.participant-name {
  font-size: clamp(1.05rem, 2.7vw, 1.65rem);
  font-weight: 700;
  color: var(--accent-red);
  margin-bottom: 3px;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.points-breakdown {
  display: flex;
  justify-content: flex-start;
  gap: clamp(10px, 3.5vw, 36px);
  width: 100%;
}

.breakdown-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 32px;
}

.breakdown-label {
  font-size: clamp(0.68rem, 1.4vw, 0.92rem);
  color: var(--border-color);
  font-weight: 600;
}

.breakdown-value {
  font-size: clamp(0.75rem, 1.5vw, 1.05rem);
  color: var(--accent-red);
  font-weight: 800;
}

.total-circle {
  width: clamp(64px, 9.5vw, 86px);
  height: clamp(64px, 9.5vw, 86px);
  min-width: clamp(64px, 9.5vw, 86px);
  border-radius: 50%;
  border: 2.5px solid var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: #ffffff;
  box-sizing: border-box;
  flex-shrink: 0;
}

.total-label {
  font-size: clamp(0.55rem, 1.1vw, 0.72rem);
  color: var(--text-dark);
  font-weight: 700;
  letter-spacing: 0.4px;
}

.total-points {
  font-size: clamp(0.95rem, 2vw, 1.3rem);
  font-weight: 800;
  color: var(--accent-red);
  line-height: 1.1;
}

.details {
  display: none;
  background: var(--bg-details);
  border-radius: 16px;
  padding: 18px;
  margin-top: 10px;
  border: 2px solid #cbd5e1;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

table { width: 100%; border-collapse: collapse; margin-top: 6px; margin-bottom: 14px; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #cbd5e1; }
th { color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; }
.section-title { font-weight: 800; color: #0284c7; margin-top: 12px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; }
.badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; background: #e2e8f0; color: #334155; }

@media (max-width: 520px) {
  .main-pill { padding: 6px 10px; min-height: 62px; }
  .points-breakdown { gap: 8px; }
  h1 { margin-top: -16px; }
  .brand-block { width: 65%; }
  .sticky-top { padding: 6px 12px 6px 12px; }
  .bg-shape { opacity: 0.04; }
}
</style>
</head>
<body>

<!-- Pattern d'éléments PNG (15 formes) -->
<div class="bg-shapes">
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>
  <div class="bg-shape s4"></div>
  <div class="bg-shape s5"></div>
  <div class="bg-shape s6"></div>
  <div class="bg-shape s7"></div>
  <div class="bg-shape s8"></div>
  <div class="bg-shape s9"></div>
  <div class="bg-shape s10"></div>
  <div class="bg-shape s11"></div>
  <div class="bg-shape s12"></div>
  <div class="bg-shape s13"></div>
  <div class="bg-shape s14"></div>
  <div class="bg-shape s15"></div>
</div>

<div class="container">

  <div class="sticky-top">
    <header class="header">
      <div class="brand-block">
        <img src="./images/hatch-logo.png" alt="Hatch Logo" class="hatch-logo" onerror="this.style.display='none'">
        <h1>🏒 NHL Super Pool 🥅</h1>
      </div>
    </header>

    <p class="last-update" id="lastUpdate">Mise à jour: —</p>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher un participant..." autocomplete="off">
    </div>
    <p class="search-hint">Cliquer sur le nom pour plus de détails</p>
  </div>

  <div id="leaderboard">Chargement du classement...</div>
</div>

<script>
let allParticipants = [];

async function loadPoolData() {
  try {
    const res = await fetch('data.json?t=' + new Date().getTime());
    const data = await res.json();
    
    displayLastUpdate(data.updated_at);

    allParticipants = compute1224Ranking(data.leaderboard);
    renderLeaderboard(allParticipants);
    
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        renderLeaderboard(allParticipants);
        return;
      }
      const filtered = allParticipants.filter(p => 
        p.name.toLowerCase().includes(query)
      );
      renderLeaderboard(filtered);
    });
    
  } catch (e) {
    console.error(e);
    document.getElementById('leaderboard').innerHTML = 
      "<p style='text-align:center; color:#ef4444;'>Erreur lors du chargement des données.</p>";
  }
}

function displayLastUpdate(isoString) {
  const el = document.getElementById('lastUpdate');
  if (!isoString) {
    el.textContent = 'Mise à jour: —';
    return;
  }
  try {
    const date = new Date(isoString);
    const options = { day: 'numeric', month: 'long' };
    const dateStr = date.toLocaleDateString('fr-CA', options);
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    el.textContent = `Mise à jour: ${dateStr} \( {hours}h \){minutes}`;
  } catch (e) {
    el.textContent = 'Mise à jour: —';
  }
}

function compute1224Ranking(leaderboard) {
  let result = [];
  let currentRank = 1;
  for (let i = 0; i < leaderboard.length; i++) {
    if (i > 0 && leaderboard[i].total_points < leaderboard[i - 1].total_points) {
      currentRank = i + 1;
    }
    result.push({ ...leaderboard[i], rank: currentRank });
  }
  return result;
}

function renderLeaderboard(list) {
  const container = document.getElementById('leaderboard');
  container.innerHTML = '';

  if (list.length === 0) {
    container.innerHTML = '<p class="no-results">Aucun participant trouvé.</p>';
    return;
  }

  list.forEach((p, index) => {
    const card = document.createElement('div');
    card.className = 'participant-card';

    let skatersHtml = p.skaters.map(s => {
      const displayPos = (s.position === 'D') ? 'D' : 'A';
      return '<tr>' +
        '<td><b>' + (s.name || '') + '</b> <span class="badge">' + displayPos + '</span></td>' +
        '<td>' + (s.goals || 0) + ' B, ' + (s.assists || 0) + ' P</td>' +
        '<td><b>' + (s.points || 0) + ' pts</b></td>' +
        '</tr>';
    }).join('');

    let goaliesHtml = p.goalies.map(g => {
      return '<tr>' +
        '<td><b>' + (g.name || '') + '</b> <span class="badge">G</span></td>' +
        '<td>' + (g.wins || 0) + ' V, ' + (g.shutouts || 0) + ' BL, ' + (g.otLosses || 0) + ' DP</td>' +
        '<td><b>' + (g.points || 0) + ' pts</b></td>' +
        '</tr>';
    }).join('');

    let teamsHtml = p.teams.map(t => {
      return '<tr>' +
        '<td><b>' + (t.name || '') + '</b> (' + (t.abbrev || '') + ')</td>' +
        '<td>' + (t.reg_wins || 0) + ' VR, ' + (t.ot_wins || 0) + ' VP, ' + (t.ot_losses || 0) + ' DP</td>' +
        '<td><b>' + (t.points || 0) + ' pts</b></td>' +
        '</tr>';
    }).join('');

    let trendHtml = '<span class="trend-arrow same"></span>';
    if (p.trend === 'up') {
      trendHtml = '<span class="trend-arrow up" title="En hausse">▲</span>';
    } else if (p.trend === 'down') {
      trendHtml = '<span class="trend-arrow down" title="En baisse">▼</span>';
    }

    const detailId = index;
    const crownHtml = p.rank === 1 ? '<span class="crown">👑</span>' : '';

    card.innerHTML = 
      '<div class="main-pill" onclick="toggleDetails(' + detailId + ')">' +
        '<div class="rank-section">' +
          '<span class="rank-number">' + crownHtml + '#' + p.rank + '</span>' +
          trendHtml +
        '</div>' +
        '<div class="participant-info" id="info-' + detailId + '">' +
          '<div class="participant-name">' + p.name + '</div>' +
          '<div class="points-breakdown">' +
            '<div class="breakdown-item"><span class="breakdown-label">Att</span><span class="breakdown-value">' + (p.att_pts || 0) + '</span></div>' +
            '<div class="breakdown-item"><span class="breakdown-label">Def</span><span class="breakdown-value">' + (p.def_pts || 0) + '</span></div>' +
            '<div class="breakdown-item"><span class="breakdown-label">Goaler</span><span class="breakdown-value">' + (p.goalie_pts || 0) + '</span></div>' +
            '<div class="breakdown-item"><span class="breakdown-label">Equipe</span><span class="breakdown-value">' + (p.team_pts || 0) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="total-circle">' +
          '<span class="total-label">TOTAL</span>' +
          '<span class="total-points">' + (p.total_points || 0) + ' pts</span>' +
        '</div>' +
      '</div>' +
      '<div class="details" id="details-' + detailId + '">' +
        '<div class="section-title">Attaquants & Défenseurs</div>' +
        '<table><thead><tr><th>Joueur</th><th>Statistiques</th><th>Points</th></tr></thead><tbody>' + skatersHtml + '</tbody></table>' +
        '<div class="section-title">Gardiens</div>' +
        '<table><thead><tr><th>Gardien</th><th>Statistiques</th><th>Points</th></tr></thead><tbody>' + goaliesHtml + '</tbody></table>' +
        '<div class="section-title">Équipes</div>' +
        '<table><thead><tr><th>Équipe</th><th>Statistiques</th><th>Points</th></tr></thead><tbody>' + teamsHtml + '</tbody></table>' +
      '</div>';

    container.appendChild(card);
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      applyResponsiveLayout();
    });
  });
}

function applyResponsiveLayout() {
  document.querySelectorAll('.participant-info').forEach(info => {
    info.classList.remove('wide');

    const nameEl = info.querySelector('.participant-name');
    const breakdownEl = info.querySelector('.points-breakdown');
    if (!nameEl || !breakdownEl) return;

    const available = info.clientWidth;
    const nameW = nameEl.scrollWidth;
    const breakW = breakdownEl.scrollWidth;

    if (nameW + breakW + 18 < available) {
      info.classList.add('wide');
    }
  });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyResponsiveLayout, 60);
});

function toggleDetails(index) {
  const el = document.getElementById('details-' + index);
  if (el) {
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  }
}

loadPoolData();
</script>
</body>
</html>
